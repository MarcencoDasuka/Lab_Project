name: Build and Deploy ToDoList

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build ToDoList JAR
      run: |
        cd ToDoList
        mvn clean package -DskipTests

    - name: Build ToDoAnalytics JAR
      run: |
        cd ToDoAnalytics
        mvn clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push ToDoList image
      uses: docker/build-push-action@v5
      with:
        context: ./ToDoList
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/todolist-app:latest

    - name: Build and push ToDoAnalytics image
      uses: docker/build-push-action@v5
      with:
        context: ./ToDoAnalytics
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/todoanalytics-app:latest

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./ToDoList/frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/todo-frontend:latest